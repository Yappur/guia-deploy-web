<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contacto — Vintage Oversize</title>
    <link rel="stylesheet" href="../css/style.css" />
    <meta name="description" content="Contacto y consultas." />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="../">Vintage Oversize</a>
        <nav class="main-nav">
          <a href="../">Inicio</a>
          <a href="productos.html">Productos</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <h1>Contacto</h1>
      <p class="lead">
        ¿Tienes alguna consulta sobre talles o pedidos? Escríbenos.
      </p>

      <section class="contact-grid">
        <div class="contact-info">
          <h2>Información</h2>
          <p>Email: hola@vintageoversize.example</p>
          <p>Instagram: @vintageoversize</p>
          <p>Horario: Lun-Vie 10:00 - 18:00</p>
        </div>

        <form class="contact-form" action="#" method="post">
          <label
            >Nombre
            <input type="text" name="nombre" placeholder="Tu nombre" />
          </label>
          <label
            >Email
            <input type="email" name="email" placeholder="tu@ejemplo.com" />
          </label>
          <label
            >Mensaje
            <textarea
              name="mensaje"
              rows="5"
              placeholder="¿En qué te podemos ayudar?"
            ></textarea>
          </label>
          <p><button class="btn" type="submit">Enviar</button></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2026 Vintage Oversize</p>
      </div>
    </footer>
  </body>
</html>
